name: MLForge CD Pipeline

on:
  workflow_run:
    workflows: ["MLForge CI Pipeline"]
    types:
      - completed
    branches:
      - main

jobs:
  publish:
    # Only run if CI passed successfully
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
    
    # In a real project, we would login to GHCR
    # - name: Log in to the Container registry
    #   uses: docker/login-action@v3
    #   with:
    #     registry: ghcr.io
    #     username: ${{ github.actor }}
    #     password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Build Docker images
      run: |
        docker compose build
        
    - name: Tag images for GHCR
      run: |
        echo "Tagging images for GitHub Container Registry..."
        # Example tags
        # docker tag mlforge-api-gateway:latest ghcr.io/${{ github.repository }}/api-gateway:latest
        # docker tag mlforge-auth-service:latest ghcr.io/${{ github.repository }}/auth-service:latest
        
    - name: Push images
      run: |
        echo "Pushing images to registry..."
        echo "NOTE: This is a demonstration pipeline. Actual push is disabled to prevent polluting GHCR."
