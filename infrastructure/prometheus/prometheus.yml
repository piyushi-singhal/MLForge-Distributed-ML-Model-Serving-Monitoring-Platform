global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "api-gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api-gateway:8000"]

  - job_name: "auth-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["auth-service:8000"]

  - job_name: "model-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["model-service:8000"]

  - job_name: "training-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["training-service:8000"]

  - job_name: "prediction-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["prediction-service:8000"]

  - job_name: "training-worker"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["training-worker:8000"]
